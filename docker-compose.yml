services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:19092,OUTSIDE://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --pandaproxy-addr=0.0.0.0:18082
      - --advertise-pandaproxy-addr=localhost:18082
    ports:
      - "19092:19092"
      - "19644:9644"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:19092 cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.5
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - "18080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:19092

  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17
    command: jobmanager
    ports:
      - "18081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./flink/lib:/opt/flink/usrlib:ro
      - ./sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
    volumes:
      - ./flink/lib:/opt/flink/usrlib:ro
      - ./sql:/opt/flink/sql:ro

  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=1
      - -c
      - max_wal_senders=1
    environment:
      - POSTGRES_DB=apm_metadata
      - POSTGRES_USER=apm
      - POSTGRES_PASSWORD=apm_secret
    ports:
      - "15432:5432"
    volumes:
      - ./sql/postgres_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm_metadata"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-connect:
    image: debezium/connect:2.7.1.Final
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "18083:8083"
    environment:
      - BOOTSTRAP_SERVERS=redpanda:19092
      - GROUP_ID=debezium-connect
      - CONFIG_STORAGE_TOPIC=debezium_connect_configs
      - OFFSET_STORAGE_TOPIC=debezium_connect_offsets
      - STATUS_STORAGE_TOPIC=debezium_connect_statuses
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-connect
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  doris:
    image: apache/doris:3.0.5-all
    entrypoint: ["bash", "-lc", "bash entry_point.sh && tail -f /dev/null"]
    ports:
      - "18030:8030"
      - "19030:9030"
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010
      - FE_ID=1
      - SKIP_CHECK_ULIMIT=true
    volumes:
      - ./sql:/opt/doris/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -h127.0.0.1 -P9030 -N -B -e 'SHOW BACKENDS' 2>/dev/null | awk -F '\\t' '{ if ($10 == \"true\") found = 1 } END { exit !found }'"]
      interval: 15s
      timeout: 10s
      retries: 20
