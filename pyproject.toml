[project]
name = "industrial-apm-flink-agent-triage"
version = "0.1.0"
description = "Real-time industrial APM data pipeline portfolio project with synthetic telemetry, Flink-ready contracts, and LLM-assisted alert triage."
readme = "README.md"
requires-python = ">=3.13,<3.16"
dependencies = [
  "jsonschema>=4.25.0",
  "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "llm: tests that require a real LLM API connection (OPENAI_API_KEY in env)",
]

