schema_version: anomaly_rules.v1
rules:
  - rule_id: missing_heartbeat
    name: Missing heartbeat
    scenario: missing_heartbeat
    method: heartbeat_gap
    severity: critical
    parameters:
      max_gap_minutes: 10
  - rule_id: flatline
    name: Flatline sensor value
    scenario: flatline
    method: repeated_value_window
    severity: warning
    parameters:
      min_repeated_points: 6
  - rule_id: threshold_spike
    name: Threshold spike
    scenario: spike
    method: static_threshold
    severity: critical
    parameters:
      multiplier: 2.5
  - rule_id: rolling_zscore
    name: Rolling baseline z-score
    scenario: late
    method: rolling_baseline_zscore
    severity: warning
    parameters:
      window_points: 24
      zscore_threshold: 3.0
  - rule_id: drift_rate_of_change
    name: Drift rate of change
    scenario: drift
    method: slope_over_window
    severity: warning
    parameters:
      window_points: 36
      max_slope_per_hour: 0.8

