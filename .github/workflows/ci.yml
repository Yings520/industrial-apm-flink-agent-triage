name: CI - Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install 'pytest>=8.0'

      - name: Run core tests
        run: python -m pytest

      - name: Verify no Docker or external service dependency in CI
        run: |
          echo "CI runs core tests without Docker, OPENAI_API_KEY, or TEAMS_WEBHOOK_URL."
